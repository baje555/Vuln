services:
  - type: web
    name: vulnlab-tech
    env: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/vulnlab-tech-1.0.0.jar
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://localhost:3306/vulnlab_db
      - key: SPRING_DATASOURCE_USERNAME
        value: vulnlab
      - key: SPRING_DATASOURCE_PASSWORD
        value: vulnlab123
