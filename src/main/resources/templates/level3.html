<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 3 - Stored XSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        nav {
            background: rgba(0, 0, 0, 0.8);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: #667eea;
        }
        
        .nav-brand {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .nav-links {
            display: flex;
            gap: 1rem;
        }
        
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .card {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        .description {
            background: #f5f5f5;
            padding: 1rem;
            border-left: 4px solid #667eea;
            margin-bottom: 1.5rem;
            border-radius: 4px;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            min-height: 100px;
        }
        
        button {
            background: #667eea;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .alert {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
        
        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }
        
        .profile-info {
            background: #f0f0f0;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
        }
        
        .flag {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
            font-weight: bold;
            color: #856404;
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-brand">VulnLab Tech</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="card">
            <h1>Level 3 - Stored XSS</h1>
            
            <div class="description">
                <strong>Challenge:</strong> Users can update their profile information which is stored and displayed to other users. Input validation is not properly implemented.
            </div>
            
            <div th:if="${flag}" class="flag" th:text="${flag}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            
            <form method="post">
                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" placeholder="Try: &lt;script&gt;alert('Stored XSS')&lt;/script&gt;"></textarea>
                </div>
                
                <button type="submit">Update Profile</button>
            </form>
            
            <div th:if="${user}" class="profile-info">
                <h3>Your Profile</h3>
                <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
                <p><strong>Bio:</strong> <span th:utext="${user.bio}"></span></p>
            </div>
        </div>
    </div>
</body>
</html>
